[project]
name = "context-curator"
version = "0.0.2"
description = "Relevance-driven working-set policy and curated context store for Claude Code."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "mcp>=1.2",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3", "onnxruntime>=1.17"]

[project.scripts]
# Console scripts: cc-inspect/cc-statusline write to a user terminal, and cc-mcp is a long-lived
# stdio server (one process, not a per-event flash).
cc-statusline = "context_curator.observe.statusline:main"
cc-inspect    = "context_curator.observe.decision_log:main"
cc-mcp        = "context_curator.mcp_server:main"

# GUI scripts use the pythonw launcher (GUI subsystem), so Windows never auto-creates a console
# window when Claude Code spawns these hooks per event (the source of the flashing-window pop-ups).
# Their stdio still works because Claude pipes stdin (event JSON) and stdout (inject JSON) to the
# child -- a piped handle keeps sys.stdin/sys.stdout valid even under pythonw (verified). Hooks must
# stay GUI scripts; test_entry_points.py guards against a regression back to console scripts.
[project.gui-scripts]
cc-hook-session-start = "context_curator.hooks.session_start:main"
cc-hook-user-prompt   = "context_curator.hooks.user_prompt_submit:main"
cc-hook-pre-tool-use  = "context_curator.hooks.pre_tool_use:main"
cc-hook-post-tool-use = "context_curator.hooks.post_tool_use:main"
cc-hook-subagent-stop = "context_curator.hooks.subagent_stop:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
